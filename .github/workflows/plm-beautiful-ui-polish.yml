name: PLM BeautifulUI r1 polish
on:
  push:
    branches: [plm-ui-refactor]
    paths:
      - "plm/scripts/polish_beautiful_ui_r1.py"
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: uv sync --extra qt --locked
      - run: uv run python scripts/polish_beautiful_ui_r1.py
      - run: uv run python -m compileall -q src/plm/frontend/qt
      - name: Focused Qt smoke
        run: uv run python -m unittest tests.test_qt_controls tests.test_qt_artifacts
      - name: Commit visual polish
        run: |
          git config user.name "MaNan"
          git config user.email "50885527+MaNan93@users.noreply.github.com"
          git add src/plm/frontend/qt
          git commit -m "style(qt): polish BeautifulUI r1 visuals"
          git push
