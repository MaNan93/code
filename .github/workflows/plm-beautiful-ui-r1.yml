name: PLM BeautifulUI r1 patch
on:
  push:
    branches: [plm-ui-refactor]
    paths:
      - "plm/scripts/apply_beautiful_ui_r1.py"
      - "plm/scripts/fix_beautiful_ui_runner.py"
      - "plm/scripts/finish_beautiful_ui_r1.py"
      - "plm/scripts/update_beautiful_ui_tests.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
      - run: uv sync --extra qt --locked
      - name: Harden one-shot patch script
        run: uv run python scripts/fix_beautiful_ui_runner.py
      - name: Apply BeautifulUI redesign
        run: uv run python scripts/apply_beautiful_ui_r1.py
      - name: Finish token cleanup
        run: uv run python scripts/finish_beautiful_ui_r1.py
      - name: Update token-based visual assertions
        run: uv run python scripts/update_beautiful_ui_tests.py
      - name: Compile Qt frontend
        run: uv run python -m compileall -q src/plm/frontend/qt
      - name: Functional UI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest tests.test_qt_controls tests.test_qt_artifacts
      - name: Commit redesign
        run: |
          git config user.name "MaNan"
          git config user.email "50885527+MaNan93@users.noreply.github.com"
          git add src/plm/frontend/qt tests/test_qt_artifacts.py
          if git diff --cached --quiet; then
            echo "No application changes"
          else
            git commit -m "style(qt): redesign PLM with BeautifulUI tokens"
            git push
          fi
