name: Apply PLM Formatter review fixes

on:
  push:
    branches:
      - plm-ui-refactor
    paths:
      - ".github/workflows/plm-formatter-review-fix-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: plm/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - working-directory: plm
        run: uv sync --extra qt --locked
      - name: Apply requested fixes
        working-directory: plm
        run: uv run python scripts/apply_formatter_tab_fixes.py
      - name: Compile
        working-directory: plm
        run: uv run python -m compileall -q src scripts/capture_ui.py tests/test_qt_generation.py
      - name: Focused Formatter smoke
        working-directory: plm
        run: |
          uv run python - <<'PY'
          import os
          from PyQt5 import QtWidgets
          from plm.core.verible import VERIBLE_BUILTIN_DEFAULTS
          from plm.frontend.qt.views.settings_page import SettingsPage

          app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          page = SettingsPage(preferences={"verible_flags": {}})
          page.show(); app.processEvents()
          page._show_section(3); app.processEvents()

          assert page.settings_content_layout.getContentsMargins() == (32, 24, 32, 24)
          assert page.settings_content_layout.stretch(page._formatter_layout_index) == 1
          assert page.settings_content_layout.stretch(page._bottom_stretch_index) == 0
          assert page.flag_table.verticalScrollMode() == QtWidgets.QAbstractItemView.ScrollPerPixel
          assert page.flag_table.minimumHeight() == 240

          align = page._flag_controls["assignment_statement_alignment"]
          assert VERIBLE_BUILTIN_DEFAULTS["assignment_statement_alignment"] == "infer"
          assert align.itemText(0) == "infer (default)"
          assert align.itemData(0) == ""
          assert [align.itemText(i) for i in range(1, align.count())] == [
              "align", "flush-left", "preserve"
          ]
          indent = page._flag_controls["formal_parameters_indentation"]
          assert indent.itemText(0) == "wrap (default)"
          assert page._preferences()["verible_flags"] == {}

          align.setCurrentText("align")
          assert page._preferences()["verible_flags"]["assignment_statement_alignment"] == "align"
          page._fill_flags({})
          assert align.currentText() == "infer (default)"
          assert page._preferences()["verible_flags"] == {}
          page._fill_flags(None)
          assert align.currentText() == "align"
          assert page._preferences()["verible_flags"] is None
          print("focused Formatter smoke passed")
          PY
      - name: Existing Formatter integration tests
        working-directory: plm
        run: |
          uv run python -u -m unittest -v \
            tests.test_qt_generation.GenerationIntegrationTests.test_formatter_flags_none_empty_and_custom_round_trip \
            tests.test_qt_generation.GenerationIntegrationTests.test_formatter_parameter_validation_and_detection
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "MaNan"
          git config user.email "50885527+MaNan93@users.noreply.github.com"
          git add \
            plm/src/plm/core/verible.py \
            plm/src/plm/frontend/qt/views/settings_page.py \
            plm/scripts/capture_ui.py
          git commit -m "fix(qt): optimize Formatter settings tab"
          git push origin HEAD:plm-ui-refactor
