name: PLM functional patch verify

on:
  push:
    paths:
      - ".github/workflows/plm-restore-verify.yml"
      - "plm/scripts/finalize_restored_workflow_tests.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: uv sync --extra qt --locked
      - name: Apply focused functional patch
        run: uv run python scripts/finalize_restored_workflow_tests.py
      - name: Verify New Project default directory
        run: timeout 40s uv run python -u -m unittest -v tests.test_qt_workflow.QtWorkflowTests.test_new_project_uses_standard_projects_directory
      - name: Verify Artifacts blank-click dismissal
        run: timeout 40s uv run python -u -m unittest -v tests.test_qt_artifacts.ArtifactPreviewTests.test_file_tree_blank_click_closes_overlay
      - name: Persist verified functional changes
        shell: bash
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add \
            plm/src/plm/frontend/qt/controllers/app_controller.py \
            plm/src/plm/frontend/qt/views/artifacts_panel.py \
            plm/tests/test_qt_workflow.py \
            plm/tests/test_qt_artifacts.py
          git -C .. commit -m "qt: restore project defaults and tree dismissal"
          git -C .. push origin HEAD:plm-ui-refactor
