name: Apply PLM project-menu and Signals review fixes

on:
  push:
    branches:
      - plm-ui-refactor
    paths:
      - ".github/workflows/plm-review-fix-project-menu-signals-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: plm/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - working-directory: plm
        run: uv sync --extra qt --locked
      - name: Apply requested fixes
        working-directory: plm
        run: |
          uv run python scripts/apply_project_menu_signal_layout_fixes.py
          uv run python scripts/apply_project_menu_signal_layout_fixes_followup.py
      - name: Compile
        working-directory: plm
        run: uv run python -m compileall -q src tests/test_qt_controls.py scripts/capture_ui.py
      - name: Focused functional checks
        working-directory: plm
        run: |
          uv run python -u -m unittest -v \
            tests.test_qt_controls.QtControlLogicTests.test_project_context_menu_has_no_redundant_clear_action \
            tests.test_qt_controls.QtControlLogicTests.test_table_context_menu_inserts_and_deletes_rows \
            tests.test_qt_controls.QtControlLogicTests.test_lane_grid_context_menu_inserts_and_deletes_modes
      - name: Focused menu/style checks
        working-directory: plm
        run: |
          uv run python - <<'PY'
          from PyQt5 import QtCore, QtWidgets
          from plm.frontend.qt.widgets.common import StyledMenu
          app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          menu = StyledMenu()
          assert menu.testAttribute(QtCore.Qt.WA_TranslucentBackground)
          assert menu.windowFlags() & QtCore.Qt.FramelessWindowHint
          assert menu.windowFlags() & QtCore.Qt.NoDropShadowWindowHint
          print("menu transparency smoke passed")
          PY
      - name: Capture requested UI review
        working-directory: plm
        env:
          QT_QPA_PLATFORM: offscreen
          PLM_SCREENSHOT_DIR: review-screenshots
        run: uv run python scripts/capture_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: plm-project-menu-signals-review
          path: plm/review-screenshots/*.png
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "MaNan"
          git config user.email "50885527+MaNan93@users.noreply.github.com"
          git add \
            plm/src/plm/frontend/qt/widgets/project_item.py \
            plm/src/plm/frontend/qt/widgets/project_list.py \
            plm/src/plm/frontend/qt/controllers/app_controller.py \
            plm/src/plm/frontend/qt/widgets/common.py \
            plm/src/plm/frontend/qt/styles/app.qss \
            plm/src/plm/frontend/qt/widgets/tables.py \
            plm/src/plm/frontend/qt/widgets/lanegrid.py \
            plm/src/plm/frontend/qt/widgets/config_editor.py \
            plm/src/plm/frontend/qt/views/config_page.py \
            plm/tests/test_qt_controls.py \
            plm/scripts/capture_ui.py
          git commit -m "fix(qt): clarify project menu and fill Signals panel"
          git push origin HEAD:plm-ui-refactor
