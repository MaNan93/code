name: Apply PLM UI review fixes

on:
  push:
    branches:
      - plm-ui-refactor
    paths:
      - ".github/workflows/plm-ui-review-fix-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: plm/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - working-directory: plm
        run: uv sync --extra qt --locked
      - name: Apply requested fixes
        working-directory: plm
        run: uv run python scripts/apply_ui_review_fixes.py
      - name: Compile
        working-directory: plm
        run: uv run python -m compileall -q src scripts/capture_ui.py tests/test_qt_controls.py
      - name: Focused UI logic smoke
        working-directory: plm
        run: |
          uv run python - <<'PY'
          import os
          from unittest.mock import patch
          from PyQt5 import QtCore, QtGui, QtWidgets
          from plm.frontend.qt.views.artifacts_panel import ArtifactsPanel
          from plm.frontend.qt.views.new_project_dialog import NewProjectDialog
          from plm.frontend.qt.views.settings_page import SettingsPage
          from plm.frontend.qt.widgets.config_editor import CsvTableEditor

          app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          app.setStyle("Fusion")

          table = CsvTableEditor(("ctrl_id", "ctrl_name", "max_width"))
          menu = table._build_row_context_menu(0)
          assert [a.text() for a in menu.actions() if not a.isSeparator()] == [
              "在上方插入行", "在下方插入行", "删除当前行"
          ]

          page = SettingsPage(preferences={"font_family": "DejaVu Sans"})
          page.show(); app.processEvents()
          expected = [
              "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC",
              "SimHei", "SimSun", "Source Han Sans SC", "DejaVu Sans", "更多字体..."
          ]
          assert [page.font_family_combo.itemText(i) for i in range(page.font_family_combo.count())] == expected
          page._show_section(0); app.processEvents()
          assert page.setting_rows["editor"].isVisible()
          assert not page.setting_rows["font"].isVisible()
          assert not page.setting_rows["size"].isVisible()
          page._show_section(1); app.processEvents()
          assert page.setting_rows["font"].isVisible()
          assert page.setting_rows["size"].isVisible()
          assert not page.setting_rows["editor"].isVisible()
          with patch.object(QtWidgets.QFontDialog, "getFont", return_value=(QtGui.QFont("Liberation Sans"), True)):
              page._font_choice_activated(page.font_family_combo.findText("更多字体..."))
          assert page.font_family_combo.currentText() == "Liberation Sans"

          dlg = NewProjectDialog(None)
          assert dlg.location.text() == os.path.expanduser("~/plm-projects")

          artifacts = ArtifactsPanel()
          layout = artifacts.search_bar.layout()
          assert layout.spacing() == 8
          assert layout.getContentsMargins() == (0, 0, 12, 0)
          buttons = artifacts.search_bar.findChildren(QtWidgets.QPushButton)
          assert len(buttons) == 3
          assert all(button.size() == QtCore.QSize(24, 24) for button in buttons)
          print("focused UI smoke passed")
          PY
      - name: Fast controls test
        working-directory: plm
        run: uv run python -u -m unittest -v tests.test_qt_controls
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "MaNan"
          git config user.email "50885527+MaNan93@users.noreply.github.com"
          git add \
            plm/src/plm/frontend/qt/widgets/tables.py \
            plm/src/plm/frontend/qt/widgets/config_editor.py \
            plm/src/plm/frontend/qt/views/settings_page.py \
            plm/src/plm/frontend/qt/views/new_project_dialog.py \
            plm/src/plm/frontend/qt/controllers/app_controller.py \
            plm/src/plm/frontend/qt/views/artifacts_panel.py \
            plm/tests/test_qt_controls.py \
            plm/scripts/capture_ui.py
          git commit -m "fix(qt): address UI review feedback"
          git push origin HEAD:plm-ui-refactor
