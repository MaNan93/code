name: PLM UI screenshots
on:
  push:
    paths:
      - ".github/workflows/plm-ui-screenshots.yml"
      - "plm/scripts/capture_ui.py"
      - "plm/scripts/fix_restore_compat.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
      - run: uv sync --extra qt --locked
      - name: Apply compatibility patch
        run: uv run python scripts/fix_restore_compat.py
      - name: Verify restored frontend contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -u -m unittest -v \
            tests.test_qt_frontend.QtFrontendLayoutTests.test_artifacts_is_absolute_overlay_with_drag_handle \
            tests.test_qt_frontend.QtFrontendLayoutTests.test_config_header_inline_rename_save_and_cancel \
            tests.test_qt_frontend.QtFrontendLayoutTests.test_native_window_and_nested_splitters \
            tests.test_qt_frontend.QtFrontendLayoutTests.test_nav_actions_projects_and_drag_configuration \
            tests.test_qt_frontend.QtFrontendLayoutTests.test_required_lucide_assets_exist_and_render
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" uv run python scripts/capture_ui.py
      - name: Commit verified fixes
        run: |
          rm scripts/fix_restore_compat.py
          git -C .. diff --check
          git -C .. config user.name "MaNan"
          git -C .. config user.email "50885527+MaNan93@users.noreply.github.com"
          git -C .. add -A .github/workflows/plm-ui-screenshots.yml plm/src/plm/frontend/qt/views/artifacts_panel.py plm/src/plm/frontend/qt/controllers/app_controller.py plm/tests/test_qt_frontend.py plm/scripts/fix_restore_compat.py
          git -C .. commit -m "test: isolate restored Qt interactions"
          git -C .. push origin HEAD:plm-ui-refactor
      - uses: actions/upload-artifact@v4
        with:
          name: plm-ui-screenshots
          path: plm/ui-screenshots/*.png
