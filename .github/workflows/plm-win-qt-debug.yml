name: PLM Windows Qt debug

on:
  push:
    paths:
      - ".github/workflows/plm-win-qt-debug.yml"
      - "plm/scripts/fix_qt_frontend_lifecycle.py"
      - "plm/scripts/restore_preview_features.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra qt --locked
      - name: Apply lifecycle guard
        run: uv run python scripts/fix_qt_frontend_lifecycle.py
      - name: Restore preview behaviors
        run: uv run python scripts/restore_preview_features.py
      - name: Verify restored Qt behaviors
        run: uv run python -u -m unittest -v tests.test_qt_artifacts tests.test_qt_frontend
      - name: Persist verified restoration and remove scaffolding
        shell: pwsh
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add plm/src/plm/frontend/qt/views/artifacts_panel.py plm/tests/test_qt_artifacts.py plm/tests/test_qt_frontend.py
          git -C .. rm plm/scripts/fix_qt_frontend_lifecycle.py plm/scripts/restore_preview_features.py .github/workflows/plm-win-qt-debug.yml
          git -C .. commit -m "qt: restore preview interaction behaviors"
          git -C .. push origin HEAD:plm-ui-refactor
