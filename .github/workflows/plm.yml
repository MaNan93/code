name: PLM regression

on:
  push:
    paths:
      - "plm/**"
      - ".github/workflows/plm.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "plm/**"
      - ".github/workflows/plm.yml"
      - ".gitattributes"

concurrency:
  group: plm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plm
    env:
      # tests/test_qt_frontend.py builds real widgets; there is no display
      # on any runner, so Qt has to use its headless platform plugin.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The PyQt5 wheel links against libGL/libEGL even for the offscreen
      # platform, and the Linux runner image doesn't ship them.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: uv sync --extra qt --locked
      - run: uv run python -m compileall -q src run.py tests
      - run: uv run python -m unittest discover -s tests -v

  rtl-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: uv sync --locked
      - run: PLM_RUN_RTL_SIM=1 uv run python -m unittest -v tests.test_dpr_phy_input

  wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          working-directory: plm
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: uv sync --extra qt --locked
      - run: uv build --wheel
      - run: uv run python scripts/check_wheel.py
