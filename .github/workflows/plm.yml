name: PLM regression

on:
  push:
    paths:
      - "plm/**"
      - ".github/workflows/plm.yml"
  pull_request:
    paths:
      - "plm/**"
      - ".github/workflows/plm.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[web]"
      - run: python -m compileall -q src run.py tests
      - run: python -m unittest discover -s tests -v

  wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install --no-deps dist/plm-*.whl
      - run: >-
          wheel-venv/bin/python -c "import tempfile;
          from pathlib import Path;
          from plm.core.paths import DOCS_DIR;
          from plm.core.workspace import load_default_signals, scaffold_default_content;
          from plm.core.model import Config;
          root=Path(tempfile.mkdtemp())/'new-project';
          scaffold_default_content(root);
          cfg=Config(root/'config');
          assert len(load_default_signals()) > 20;
          assert (DOCS_DIR/'tool_usage.md').is_file();
          assert not cfg.validate()"
