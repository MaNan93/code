name: Build ralf2xlsx Wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ralf2xlsx/**"
      - ".github/workflows/ralf2xlsx.yml"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ralf2xlsx

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -lh dist/

      - name: Install wheel in clean venv
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install --upgrade pip
          .venv-test/bin/python -m pip install dist/*.whl

      - name: Verify console entry point
        run: |
          .venv-test/bin/ralf2xlsx --help
          rm -f example.xlsx
          .venv-test/bin/ralf2xlsx example.ralf -t soc -o example.xlsx
          test -s example.xlsx
          .venv-test/bin/python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("example.xlsx", read_only=True)
          names = set(wb.sheetnames)
          required = {"soc.uart[0]", "soc.uart[1]", "soc.dma", "soc.bridge"}
          missing = required - names
          assert not missing, "missing per-block sheets: %s" % sorted(missing)
          assert "soc.bridge.pci" not in names and "soc.bridge.ahb" not in names
          print("verified block sheets:", sorted(required))
          PY
          ls -lh example.xlsx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ralf2xlsx-wheel
          path: ralf2xlsx/dist/*.whl
          retention-days: 90
