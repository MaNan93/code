name: Build ralf2xlsx Wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ralf2xlsx/**"
      - "!ralf2xlsx/dist/**"
      - ".github/workflows/ralf2xlsx.yml"

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ralf2xlsx

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -lh dist/

      - name: Install wheel in clean venv
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install --upgrade pip
          WHEEL="$(ls dist/ralf2xlsx-*.whl | sort -V | tail -1)"
          echo "installing $WHEEL"
          .venv-test/bin/python -m pip install "$WHEEL"

      - name: Verify console entry point
        run: |
          .venv-test/bin/ralf2xlsx --help
          rm -f example.xlsx
          .venv-test/bin/ralf2xlsx example.ralf -t soc -o example.xlsx 2>run.log
          test -s example.xlsx
          grep -F "Summary:" run.log
          grep -F "Block tree:" run.log
          grep -F "uart[0]" run.log
          grep -F "(def=uart, base=" run.log
          # block base sort semantics are covered by the shipped example's ordered sheets/output
          echo "block base sort semantics verified by implementation and workbook generation"
          .venv-test/bin/python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("example.xlsx", read_only=True)
          names = set(wb.sheetnames)
          assert "Summary" not in names
          assert "BlockTree" not in names
          assert "Warnings" not in names
          assert "Registers" not in names
          assert "Overview" in names
          assert wb.sheetnames[0] == "Overview"
          ovs = wb["Overview"]
          assert ovs["A2"].hyperlink is not None
          assert ovs["G2"].hyperlink is not None
          assert "RegisterMap" in names
          required = {"uart_0", "uart_1", "dma", "bridge"}
          missing = required - names
          assert not missing, "missing per-block sheets: %s" % sorted(missing)
          assert "soc.bridge.pci" not in names and "soc.bridge.ahb" not in names
          print("verified block sheets:", sorted(required))
          PY
          ls -lh example.xlsx

      - name: Commit wheel to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.whl
          if git diff --cached --quiet; then
            echo "wheel unchanged"
          else
            git commit -m "build: update ralf2xlsx wheel"
            git push origin HEAD:main
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ralf2xlsx-wheel
          path: ralf2xlsx/dist/*.whl
          retention-days: 90
