[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fizz"
version = "0.3.1"
description = "SV file merger with VCS Protect, Obfuscator and RLskit support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt5>=5.15"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Developer"}
]
keywords = ["verilog", "systemverilog", "merge", "vcs", "obfuscate", "rlskit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MaNan93/code"

[project.scripts]
fizz = "fizz.frontend.qt.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fizz.frontend.qt" = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md", "assets/icons/*.svg", "assets/icons/*.txt", "styles/*.qss"]
